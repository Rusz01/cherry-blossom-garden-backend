# Local development stack: Payload + PostgreSQL 16 (+ optional MinIO).
# Usage: docker compose up
# Set DATABASE_URL=postgres://postgres:postgres@postgres:5432/arthanova_cms in .env
services:
  payload:
    image: node:22.23.4-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: arthanova_cms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional S3-compatible storage. Start with: docker compose --profile minio up
  minio:
    image: minio/minio:latest
    profiles: ['minio']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin # local development only
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
  node_modules:
